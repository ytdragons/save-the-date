<style id="iv-style">
:root{
  --iv-red:  #E4141F;   /* vivid, not oxblood */

}
@media(min-width:700px){:root{--drop-s:0.034;--drop-x:46.4%;--drift:3.6vw;--drop-y:10.4svh;--landY:49.6svh;--env-w:min(40vw,272px);--can-w:min(62vw,430px)}}
@media(min-width:1000px){:root{--drop-s:0.031;--drop-x:35.0%;--drift:15.0vw;--drop-y:12.5svh;--env-w:290px;--can-w:450px;--landY:41.5svh}}

html.iv-lock,body.iv-lock{overflow:hidden;height:100%}

/* CSS animation time starts at navigation, but the inline hero image blocks
   first paint. Without this gate the intro is already seconds deep before
   anything renders. Hold everything paused until we are actually on screen.
   !important is required: the `animation` shorthand on each element resets
   animation-play-state back to running. */
.iv-root:not(.iv-go),.iv-root:not(.iv-go) *{animation-play-state:paused !important}

.iv-root{position:fixed;inset:0;z-index:300;overflow:hidden;
  opacity:1;transition:opacity .7s cubic-bezier(.4,0,.2,1)}
.iv-root.is-gone{opacity:0;pointer-events:none}

/* --- sky --------------------------------------------------------- */
.iv-sky{position:absolute;inset:0;
  background:
    radial-gradient(80% 55% at 76% 8%, rgba(255,244,222,.95), transparent 58%),
    linear-gradient(178deg,#AEC4D2 0%,#CBD8DA 30%,#E6E2D6 60%,#F4ECDE 82%,#EFE3CF 100%)}
.iv-sky::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 40% at 50% 104%, rgba(176,128,60,.22), transparent 70%)}
/* cumulus built from four offset lobes, then blurred - a single blurred
   ellipse reads as a smudge, four lobes read as cloud */
.iv-cloud{position:absolute;pointer-events:none;
  background:
    radial-gradient(40% 66% at 24% 60%, rgba(255,255,255,.98), transparent 72%),
    radial-gradient(48% 92% at 47% 42%, rgba(255,255,255,.98), transparent 74%),
    radial-gradient(36% 62% at 71% 58%, rgba(255,255,255,.94), transparent 72%),
    radial-gradient(64% 42% at 52% 76%, rgba(255,255,255,.88), transparent 74%)}
/* far bank - slow, soft, low contrast */
.iv-cloud.a{width:78vw;height:26vw;left:-22vw;top:24svh;opacity:.62;filter:blur(22px);animation:iv-drift 74s linear infinite}
.iv-cloud.b{width:58vw;height:19vw;right:-16vw;top:9svh; opacity:.5; filter:blur(26px);animation:iv-drift 92s linear infinite reverse}
.iv-cloud.c{width:96vw;height:28vw;left:-12vw;top:63svh;opacity:.44;filter:blur(30px);animation:iv-drift 110s linear infinite}
.iv-cloud.d{width:46vw;height:15vw;left:36vw;top:44svh;opacity:.38;filter:blur(24px);animation:iv-drift 84s linear infinite reverse}
/* mid - a little crisper, a little quicker */
.iv-cloud.e{width:40vw;height:14vw;left:6vw; top:52svh;opacity:.68;filter:blur(15px);animation:iv-drift2 52s linear infinite}
.iv-cloud.f{width:34vw;height:12vw;right:4vw; top:34svh;opacity:.6; filter:blur(17px);animation:iv-drift2 60s linear infinite reverse}
.iv-cloud.g{width:52vw;height:17vw;left:20vw;top:78svh;opacity:.55;filter:blur(19px);animation:iv-drift2 68s linear infinite}
/* foreground wisps - these pass in front of the plane and the letter */
.iv-fg{position:absolute;z-index:4;pointer-events:none;
  background:radial-gradient(58% 50% at 50% 50%, rgba(255,255,255,.9), transparent 72%)}
.iv-fg.x{width:120vw;height:15vw;left:-14vw;top:19svh;opacity:.3;filter:blur(30px);animation:iv-drift3 34s linear infinite}
.iv-fg.y{width:96vw; height:12vw;right:-20vw;top:57svh;opacity:.26;filter:blur(34px);animation:iv-drift3 44s linear infinite reverse}
@keyframes iv-drift{from{transform:translateX(-5vw)}to{transform:translateX(5vw)}}
@keyframes iv-drift2{from{transform:translateX(-9vw) translateY(1vw)}to{transform:translateX(9vw) translateY(-1vw)}}
@keyframes iv-drift3{from{transform:translateX(-16vw)}to{transform:translateX(16vw)}}

/* --- plane ------------------------------------------------------- */
.iv-plane{position:absolute;top:9svh;left:0;width:min(96vw,640px);
  animation:iv-cross 11s linear .4s both}
@media(min-width:1000px){.iv-plane{width:min(43vw,620px);top:12svh}}
@keyframes iv-cross{from{transform:translateX(-80vw)}to{transform:translateX(108vw)}}
.iv-bob{animation:iv-bob 5.4s ease-in-out infinite alternate}
@keyframes iv-bob{from{transform:translateY(-5px) rotate(-.4deg)}to{transform:translateY(5px) rotate(.4deg)}}
.iv-plane svg{width:100%;height:auto;overflow:visible;
  filter:drop-shadow(0 14px 26px rgba(40,52,62,.22))}

/* the door swings out on its hinge */
.iv-doorpanel{transform-box:view-box;transform-origin:184px 108px;
  animation:iv-swingdoor 1.2s cubic-bezier(.3,1.1,.4,1) 3.4s both}
@keyframes iv-swingdoor{
  0%{transform:rotate(0deg) scaleX(1);opacity:1}
  100%{transform:rotate(-96deg) scaleX(.2);opacity:0}
}
.iv-aperture{animation:iv-fade .5s ease-out 3.5s both}
@keyframes iv-fade{from{opacity:0}to{opacity:1}}

/* Chantelle pops out of the open door */
.iv-cabin{transform-box:view-box;transform-origin:211px 107px;
  animation:iv-pop .95s cubic-bezier(.2,1.5,.4,1) 4.1s both}
@keyframes iv-pop{
  0%{opacity:0;transform:translateY(15px) scale(.72)}
  40%{opacity:1}
  100%{opacity:1;transform:translateY(0) scale(1.16)}
}
/* three waves, then the arm swings down and lets go */
.iv-arm{transform-box:view-box;transform-origin:203.5px 85.5px;
  animation:iv-wave 2.4s ease-in-out 4.6s both}
@keyframes iv-wave{
  0%{transform:rotate(-8deg)}   9%{transform:rotate(18deg)}
  18%{transform:rotate(-8deg)} 27%{transform:rotate(18deg)}
  36%{transform:rotate(-8deg)} 45%{transform:rotate(18deg)}
  64%{transform:rotate(-2deg);animation-timing-function:cubic-bezier(.5,0,.4,1)}
  80%{transform:rotate(-98deg)}
  100%{transform:rotate(-88deg)}
}
/* the envelope she is holding, released at 5.4s */
.iv-held{animation:iv-release .01s linear 6.42s both}
/* Nick's glass: two small toasts while she waves */
.iv-toast{transform-box:view-box;transform-origin:228.4px 86.4px;
  animation:iv-toast 1.1s ease-in-out 4.7s 3 both}
@keyframes iv-toast{0%,100%{transform:rotate(0)}35%{transform:rotate(-9deg)}65%{transform:rotate(3deg)}}
/* long hair moving in the slipstream */
.iv-hair{transform-box:view-box;transform-origin:207px 68px;
  animation:iv-slipstream 1.8s ease-in-out infinite alternate}
@keyframes iv-slipstream{
  from{transform:rotate(-2.6deg) translateX(.4px)}
  to{transform:rotate(2.2deg) translateX(-.6px)}
}
@keyframes iv-release{from{opacity:1}to{opacity:0}}

/* --- the payload: canopy + envelope ------------------------------ */
/* iv-hold keeps the whole rig out of the sky until she lets go - without
   it, fill-mode:both paints the 0% keyframe during the delay and the
   envelope hangs there waiting for the plane to arrive. */
.iv-payload{position:absolute;top:var(--drop-y,12svh);left:var(--drop-x);width:var(--env-w);
  margin-left:calc(var(--env-w) / -2);
  animation:iv-fall 6.1s 6.4s both, iv-hold .01s linear 6.4s both}
@keyframes iv-hold{from{visibility:hidden}to{visibility:visible}}
@keyframes iv-fall{
  /* leaves her hand at the size it was in her hand, then grows as it falls toward us */
  0%  {transform:translate(0,0) scale(var(--drop-s));animation-timing-function:cubic-bezier(.5,.05,.8,.4)}
  21% {transform:translate(calc(var(--drift) * .12),30svh) scale(.36);animation-timing-function:cubic-bezier(.2,.9,.3,1)}
  26% {transform:translate(calc(var(--drift) * .2),26.5svh) scale(.52);animation-timing-function:cubic-bezier(.35,0,.4,1)}
  61% {transform:translate(calc(var(--drift) * .68),36svh) scale(.85);animation-timing-function:cubic-bezier(.4,0,.25,1)}
  93% {transform:translate(var(--drift),var(--landY)) scale(1)}
  100%{transform:translate(var(--drift),var(--landY)) scale(1)}
}
.iv-swing{transform-origin:50% calc(-.86 * var(--can-w));
  animation:iv-sway 4.9s cubic-bezier(.4,0,.35,1) 7.78s both}
@keyframes iv-sway{
  0%{transform:rotate(0deg)}   11%{transform:rotate(12deg)}
  27%{transform:rotate(-9deg)} 43%{transform:rotate(6.2deg)}
  59%{transform:rotate(-3.8deg)}75%{transform:rotate(2deg)}
  89%{transform:rotate(-.8deg)}100%{transform:rotate(0deg)}
}

/* canopy */
.iv-canopy{position:absolute;left:50%;bottom:100%;width:var(--can-w);
  margin-left:calc(var(--can-w) / -2);margin-bottom:-1%;
  transform-origin:50% 92%;
  animation:iv-deploy .62s cubic-bezier(.2,1.4,.4,1) 7.62s both,
            iv-settle .9s cubic-bezier(.16,1,.3,1) 12.5s forwards}
@keyframes iv-deploy{
  0%{opacity:0;transform:scaleY(.06) scaleX(.3)}
  40%{opacity:1}
  70%{transform:scaleY(1.08) scaleX(1.04)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes iv-settle{
  from{transform:scale(1) translateY(0) rotate(0);opacity:1;filter:none}
  to{transform:scale(.82) translateY(14%) rotate(-6deg);opacity:.72;filter:blur(.4px)}
}
.iv-canopy svg{width:100%;height:auto;display:block;
  filter:drop-shadow(0 18px 30px rgba(40,52,62,.2))}

/* contact shadow */
.iv-shadow{position:absolute;left:50%;top:100%;width:150%;height:5svh;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(52,44,34,.3),transparent 74%);
  opacity:0;animation:iv-shade .9s ease-out 12.0s both}
@keyframes iv-shade{from{opacity:0;transform:translateX(-50%) scale(.5)}to{opacity:1;transform:translateX(-50%) scale(1)}}

/* --- envelope ---------------------------------------------------- */
.iv-open-btn{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;line-height:0;
  animation:iv-tumble 1.55s cubic-bezier(.3,0,.5,1) 6.4s both}
@keyframes iv-tumble{
  0%{transform:rotate(0deg)}
  22%{transform:rotate(-7deg)}
  46%{transform:rotate(5deg)}
  70%{transform:rotate(-3deg)}
  100%{transform:rotate(0deg)}
}
.iv-env{display:block;position:relative;width:100%;aspect-ratio:3/2;perspective:1100px;
  transition:transform .6s cubic-bezier(.16,1,.3,1),filter .6s cubic-bezier(.16,1,.3,1)}
.iv-open-btn:hover .iv-env,.iv-open-btn:focus-visible .iv-env{transform:translateY(-6px)}
.iv-open-btn:focus-visible{outline:1px solid var(--iv-red);outline-offset:12px}
.iv-env__back{display:block;position:absolute;inset:0;border-radius:2px;
  background:linear-gradient(164deg,#EDEAE2,#DFDACE);
  box-shadow:0 30px 60px rgba(34,30,26,.26),0 10px 20px rgba(34,30,26,.14),
             0 1px 2px rgba(34,30,26,.16)}
.iv-env__front{display:block;position:absolute;inset:0;z-index:3;border-radius:2px;
  background:
    repeating-linear-gradient(90deg,rgba(26,24,21,.022) 0 1px,transparent 1px 5px),
    linear-gradient(164deg,#F8F6F1 0%,#F0EDE5 52%,#E6E2D8 100%);
  clip-path:polygon(0 0,50% 40%,100% 0,100% 100%,0 100%)}
.iv-env__front::after{content:"";position:absolute;inset:0;
  background:linear-gradient(102deg,transparent 38%,rgba(255,255,255,.42) 50%,transparent 62%)}
.iv-env__flap{display:block;position:absolute;top:0;left:0;width:100%;height:42%;z-index:5;
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(178deg,#F6F3EC 0%,#E9E5DA 62%,#DED8CB 100%);
  filter:drop-shadow(0 2px 3px rgba(34,30,26,.1));
  transform-origin:top center;transform:rotateX(0deg);
  transition:transform .85s cubic-bezier(.5,0,.2,1)}
/* wax seal - a height map (spread wax, stamp rim, pressed face, raised
   letters) lit as one matte surface in SVG; this only places and lifts it */
.iv-seal{position:absolute;left:50%;top:42%;z-index:6;width:22%;aspect-ratio:1;display:block;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 1px 1px rgba(60,40,10,.34)) drop-shadow(0 3px 6px rgba(60,40,10,.18));
  transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .35s}
.iv-seal svg{display:block;width:100%;height:100%;overflow:visible}
.iv-open-btn:hover .iv-seal{transform:translate(-50%,-50%) scale(1.05)}
/* heavy cotton stock, one hairline rule, nothing else. The emptiness
   is the luxury cue - anything printed on the face cheapens it. */
.iv-env__front::before{content:"";position:absolute;inset:6.5%;
  border:1px solid rgba(176,128,60,.4);pointer-events:none}


/* --- prompt & skip ----------------------------------------------- */
/* parented to the payload, so it is centred on the letter by construction
   rather than by arithmetic that has to be redone every retime */
.iv-prompt{position:absolute;left:50%;top:calc(100% + 3.2svh);transform:translateX(-50%);
  text-align:center;opacity:0;animation:iv-in .9s cubic-bezier(.16,1,.3,1) 13s both}
.iv-prompt span{display:block;font-family:'Jost',sans-serif;font-size:.72rem;
  letter-spacing:.42em;text-transform:uppercase;color:rgba(26,24,21,.62);white-space:nowrap}
.iv-prompt em{display:block;width:1px;height:26px;margin:.9rem auto 0;
  background:linear-gradient(rgba(26,24,21,.4),transparent);
  animation:iv-pulse 2.6s ease-in-out infinite}
@keyframes iv-in{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes iv-pulse{0%,100%{opacity:.35;transform:scaleY(.8)}50%{opacity:1;transform:scaleY(1)}}

.iv-skip{position:absolute;right:clamp(1rem,5vw,2.5rem);top:calc(clamp(1rem,4vw,2rem) + env(safe-area-inset-top,0px));z-index:8;
  font-family:'Jost',sans-serif;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(26,24,21,.5);padding:.6rem .2rem;
  border-bottom:1px solid rgba(26,24,21,.2);transition:color .4s,border-color .4s}
.iv-skip:hover,.iv-skip:focus-visible{color:rgba(26,24,21,.9);border-color:rgba(26,24,21,.6)}

/* --- opening sequence -------------------------------------------- */
.iv-root.is-opening .iv-canopy{opacity:0;transform:translateY(26%) scale(.72);
  transition:opacity .6s ease,transform .8s cubic-bezier(.4,0,.2,1);animation:none}
.iv-root.is-opening .iv-prompt,.iv-root.is-opening .iv-skip{opacity:0;transition:opacity .35s}
.iv-root.is-opening .iv-shadow{opacity:.16;transition:opacity .8s}
.iv-root.is-opening .iv-payload{animation:none;
  transform:translate(var(--drift),calc(var(--landY) - 6svh)) scale(1.28);
  transition:transform 1s cubic-bezier(.16,1,.3,1)}
.iv-root.is-opening .iv-open-btn{animation:none;transform:none;cursor:default}
.iv-root.is-opening .iv-seal{opacity:0;transform:translate(-50%,-50%) scale(.55) rotate(-14deg)}
.iv-root.is-opening .iv-env__flap{transform:rotateX(-172deg);z-index:1;
  transition:transform .85s cubic-bezier(.5,0,.2,1) .18s,z-index 0s .62s}
/* --- the card ----------------------------------------------------- */
/* small card: sits inside the envelope between back and front */
.iv-card{display:block;position:absolute;left:5%;top:6%;width:90%;height:86%;z-index:2;
  background:linear-gradient(168deg,#FCFBF8,#F1EEE7);border-radius:1px;
  box-shadow:0 1px 4px rgba(34,30,26,.14)}
.iv-card::before{content:"";position:absolute;inset:7%;border:1px solid rgba(176,128,60,.42)}
.iv-root.is-opening .iv-card{transform:translateY(-66%);
  transition:transform 1.05s cubic-bezier(.16,1,.3,1) .62s}

/* once the big card takes over, everything else leaves */
.iv-root.is-carded .iv-card{visibility:hidden}
.iv-root.is-carded .iv-payload{opacity:0;
  transform:translate(var(--drift),calc(var(--landY) + 22svh)) scale(1.12);
  transition:transform 1.1s cubic-bezier(.55,0,.75,.2),opacity .8s ease .1s}
.iv-root.is-carded .iv-plane{opacity:0;transition:opacity .6s}
.iv-root.is-carded .iv-skip{visibility:hidden}
.iv-root.is-opening .iv-prompt{animation:none;opacity:0;transition:opacity .3s}
.iv-root.is-instant,.iv-root.is-instant *{transition:none !important}

/* big card: flown in from the small one's exact position (FLIP, in JS) */
.iv-final{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:max(1.25rem,env(safe-area-inset-top)) 1.25rem max(1.25rem,env(safe-area-inset-bottom));
  visibility:hidden;pointer-events:none}
.iv-root.is-carded .iv-final{visibility:visible}
.iv-root.is-revealed .iv-final__float{animation:iv-float 7s ease-in-out infinite alternate}
@keyframes iv-float{from{transform:translateY(-4px) rotate(-.22deg)}to{transform:translateY(4px) rotate(.22deg)}}

.iv-final__card{position:relative;
  width:min(84vw, calc(76svh * 5 / 7), 440px);aspect-ratio:5/7;
  display:grid;align-content:center;justify-items:center;text-align:center;padding:11% 8%;
  background:
    repeating-linear-gradient(90deg,rgba(26,24,21,.02) 0 1px,transparent 1px 5px),
    linear-gradient(166deg,#FCFBF8 0%,#F3F0E9 55%,#E9E5DB 100%);
  box-shadow:0 44px 90px rgba(34,30,26,.24),0 16px 32px rgba(34,30,26,.14),0 1px 2px rgba(34,30,26,.16)}
.iv-final__card::before{content:"";position:absolute;inset:4.5%;pointer-events:none;
  border:1px solid rgba(176,128,60,.46);opacity:0;transition:opacity 1s var(--ease)}
.iv-final__card::after{content:"";position:absolute;inset:5.6%;pointer-events:none;
  border:1px solid rgba(176,128,60,.16);opacity:0;transition:opacity 1s var(--ease) .1s}
.iv-final__in{opacity:0;transform:translateY(10px);
  transition:opacity 1.1s var(--ease),transform 1.2s var(--ease)}
.iv-root.is-revealed .iv-final__in{opacity:1;transform:none}
.iv-root.is-revealed .iv-final__card::before,.iv-root.is-revealed .iv-final__card::after{opacity:1}

.iv-actions{position:relative;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  gap:clamp(1.4rem,6vw,2.4rem);margin-top:clamp(1.1rem,3.2vh,1.9rem);
  opacity:0;visibility:hidden;transition:opacity .9s var(--ease) 1.5s,visibility 0s 1.5s}
.iv-root.is-revealed .iv-actions{opacity:1;visibility:visible}
.iv-act{display:inline-flex;align-items:center;gap:.6rem;padding:.7rem .25rem;
  font-family:var(--body);font-weight:400;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(26,24,21,.55);border-bottom:1px solid rgba(26,24,21,.2);
  transition:color .4s,border-color .4s}
.iv-act--primary{color:rgba(26,24,21,.78);border-color:rgba(176,128,60,.55)}
.iv-act:hover,.iv-act:focus-visible{color:rgba(26,24,21,.95);border-color:rgba(26,24,21,.55)}
.iv-act--primary:hover,.iv-act--primary:focus-visible{border-color:var(--oak)}
.iv-act svg{width:12px;height:12px;flex:none;transition:transform .7s var(--ease)}
.iv-replay:hover svg{transform:rotate(-200deg)}

/* calendar picker: a small card of its own, opening upward over the invite */
.iv-cal{position:static}
.iv-cal__menu{position:absolute;left:50%;bottom:calc(100% + .7rem);transform:translateX(-50%);
  min-width:13.5rem;padding:.35rem;display:grid;z-index:2;
  background:linear-gradient(166deg,#FCFBF8,#F1EEE7);
  border:1px solid rgba(176,128,60,.4);
  box-shadow:0 18px 40px rgba(34,30,26,.2),0 4px 10px rgba(34,30,26,.1)}
.iv-cal__menu[hidden]{display:none}
.iv-cal__menu button{display:block;width:100%;text-align:center;padding:.85rem 1rem;
  font-family:var(--body);font-weight:400;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(26,24,21,.72);transition:background .3s,color .3s}
.iv-cal__menu button+button{border-top:1px solid rgba(26,24,21,.08)}
.iv-cal__menu button:hover,.iv-cal__menu button:focus-visible{background:rgba(176,128,60,.1);color:var(--ink)}

.iv-final__eyebrow{font-family:var(--body);font-weight:400;font-size:clamp(.58rem,2.3vw,.7rem);
  letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:var(--oak)}
.iv-final__names{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,7.4vw,2.6rem);
  line-height:1.04;letter-spacing:-.015em;color:var(--ink);margin-top:clamp(1.05rem,4.4vw,1.6rem)}
.iv-final__names span{display:block}
.iv-final__names i{font-style:italic;color:var(--oak);padding-right:.06em}

/* the date disc, carried over from the site, set on paper */
.iv-final__date{display:flex;justify-content:center;align-items:flex-end;
  gap:clamp(.35rem,1.6vw,.6rem);margin-top:clamp(1.4rem,6vw,2.3rem)}
.fw{position:relative;border:1px solid rgba(26,24,21,.13);text-align:center;
  padding:clamp(.4rem,1.6vw,.6rem) clamp(.55rem,2vw,.8rem) clamp(.35rem,1.3vw,.45rem);
  min-width:clamp(54px,15vw,78px)}
.fw::before,.fw::after{content:"";position:absolute;width:6px;height:6px;border:1px solid var(--oak)}
.fw::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.fw::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.fw--wide{min-width:clamp(80px,22vw,116px)}
.fw__clip{display:block;overflow:hidden;font-family:var(--display);
  font-size:clamp(1.2rem,5.2vw,1.85rem);line-height:1.08;
  font-variant-numeric:tabular-nums lining-nums;color:var(--ink)}
.fw--wide .fw__clip{font-size:clamp(1rem,4.3vw,1.5rem);letter-spacing:.02em}
.fw__roll{display:block}
.fw__roll b{display:block;font-weight:400;opacity:.2}
.fw__roll i{display:block;font-style:normal}
.fw__label{display:block;margin-top:.3rem;font-family:var(--body);font-weight:400;
  font-size:clamp(.48rem,1.9vw,.56rem);letter-spacing:.28em;text-indent:.28em;
  text-transform:uppercase;color:rgba(26,24,21,.45)}
.iv-root.is-revealed .fw__roll{animation:iv-disc 1.4s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes iv-disc{from{transform:translateY(-66.66%)}to{transform:none}}

.iv-final__venue{font-family:var(--display);font-style:italic;font-size:clamp(1.05rem,4.4vw,1.4rem);
  line-height:1.15;color:rgba(26,24,21,.8);margin-top:clamp(1rem,4vw,1.4rem)}
.iv-final__place{font-family:var(--body);font-weight:400;font-size:clamp(.52rem,2.05vw,.62rem);
  letter-spacing:.26em;text-indent:.26em;text-transform:uppercase;
  color:rgba(26,24,21,.5);margin-top:clamp(.4rem,1.6vw,.55rem)}
.iv-final__rule{display:block;width:34px;height:1px;background:var(--oak);
  margin:clamp(1.2rem,5.2vw,1.9rem) auto}
.iv-final__note{font-family:var(--body);font-weight:400;font-size:clamp(.56rem,2.2vw,.66rem);
  letter-spacing:.24em;text-indent:.24em;line-height:1.95;text-transform:uppercase;
  color:rgba(26,24,21,.56);margin-inline:auto}

/* --- date test: one numeral per window ----------------------------------
   The disc carries seven values before the real one and runs them past the
   window, so the flick is still there but only the date remains at rest.
   Slots are 1.34em so month descenders (the p in Apr) stay in their own slot. */
.iv-final__date{align-items:stretch}
.fw__clip{height:1.34em;line-height:1.34;font-size:clamp(1.55rem,6.6vw,2.4rem)}
.fw__roll b,.fw__roll i{line-height:1.34}
.fw--wide .fw__clip{font-size:clamp(1.55rem,6.6vw,2.4rem);letter-spacing:.01em}
.fw__roll b{opacity:1}
.iv-root.is-revealed .fw__roll{animation:iv-flick 1.75s cubic-bezier(.14,.72,.12,1) both;animation-delay:var(--d,0s)}
@keyframes iv-flick{
  0%  {transform:translateY(0);filter:blur(1.1px)}
  50% {filter:blur(.5px)}
  100%{transform:translateY(-87.5%);filter:none}
}


@media(prefers-reduced-motion:reduce){

  .iv-plane{opacity:0}
}

<script>
(function(){
  "use strict";
  var root  = document.getElementById('ivRoot');
  var open  = document.getElementById('ivOpen');
  var skip  = document.getElementById('ivSkip');
  var card  = document.getElementById('ivCard');
  var small = root.querySelector('.iv-card');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = 0, timers = [];
  var after = function(ms, fn){ timers.push(setTimeout(fn, ms)); };

  /* Start the clock only once fonts are in and the browser can paint;
     CSS animation time otherwise starts at navigation. */
  var go = function(){
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ root.classList.add('iv-go'); }); });
  };
  var whenReady = function(){
    var fonts = (document.fonts && document.fonts.ready) || Promise.resolve();
    Promise.race([fonts, new Promise(function(r){ setTimeout(r, 1500); })]).then(go);
  };
  if (document.readyState === 'complete') whenReady(); else window.addEventListener('load', whenReady);

  var reveal = function(){
    stage = 2;
    root.classList.add('is-revealed');
    card.setAttribute('tabindex', '-1');
    card.focus({preventScroll: true});
  };

  /* FLIP: lay the big card out at its final size, invert it onto the small
     card's rectangle, then release. Content stays hidden while it travels,
     since the non-uniform scale would distort the type. */
  var fly = function(){
    var a = small.getBoundingClientRect(), b = card.getBoundingClientRect();
    var dx = (a.left + a.width/2) - (b.left + b.width/2);
    var dy = (a.top + a.height/2) - (b.top + b.height/2);
    card.style.transition = 'none';
    card.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + (a.width/b.width) + ',' + (a.height/b.height) + ')';
    card.getBoundingClientRect();
    root.classList.add('is-carded');
    requestAnimationFrame(function(){
      card.style.transition = 'transform 1.15s cubic-bezier(.2,.8,.2,1)';
      card.style.transform = 'none';
    });
    after(reduce ? 60 : 1050, reveal);
  };

  var openIt = function(){
    if (stage) return;
    stage = 1;
    root.classList.add('is-opening');
    open.setAttribute('aria-disabled', 'true');
    after(reduce ? 120 : 1750, fly);
  };

  var jump = function(){
    if (stage === 2) return;
    timers.forEach(clearTimeout);
    root.classList.add('is-instant', 'is-opening', 'is-carded');
    card.style.transform = 'none';
    requestAnimationFrame(function(){
      root.classList.remove('is-instant');
      requestAnimationFrame(reveal);
    });
  };

  /* Rewind in place. Snap every transitioned property back with is-instant,
     drop the state classes (which re-creates the animations they had switched
     off), then put every running CSS animation back to its first frame.
     Falls back to a reload where the Web Animations API is missing. */
  var replay = function(){
    if (!document.getAnimations) { location.reload(); return; }
    timers.forEach(clearTimeout); timers = [];
    root.classList.add('is-instant');
    root.classList.remove('is-opening', 'is-carded', 'is-revealed');
    card.style.transform = ''; card.style.transition = '';
    card.removeAttribute('tabindex');
    open.removeAttribute('aria-disabled');
    stage = 0;
    void root.offsetWidth;
    document.getAnimations().forEach(function(a){
      if (window.CSSAnimation && !(a instanceof CSSAnimation)) return;
      a.currentTime = 0; a.play();
    });
    requestAnimationFrame(function(){
      root.classList.remove('is-instant');
      skip.focus({preventScroll: true});
    });
  };


  /* ---- add to calendar ----
     Hosted: link straight to the real .ics file beside the page - the most
     reliable way to get the iPhone "Add to Calendar" sheet. Opened as a
     local file (AirDrop): build it in the browser instead. */
  var ICS = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Chantelle & Nicholas//Save the Date//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "BEGIN:VTIMEZONE", "TZID:Australia/Sydney", "BEGIN:STANDARD", "DTSTART:19700405T030000", "RRULE:FREQ=YEARLY;BYMONTH=4;BYDAY=1SU", "TZOFFSETFROM:+1100", "TZOFFSETTO:+1000", "TZNAME:AEST", "END:STANDARD", "BEGIN:DAYLIGHT", "DTSTART:19701004T020000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=1SU", "TZOFFSETFROM:+1000", "TZOFFSETTO:+1100", "TZNAME:AEDT", "END:DAYLIGHT", "END:VTIMEZONE", "BEGIN:VEVENT", "UID:chantelle-nicholas-wedding-20270513@save-the-date", "DTSTAMP:20261030T000000Z", "DTSTART;TZID=Australia/Sydney:20270513T153000", "DTEND;TZID=Australia/Sydney:20270513T230000", "SUMMARY:Chantelle & Nicholas - Wedding Day", "LOCATION:Centennial Vineyards\\, 252 Centennial Road\\, Bowral NSW 2576", "DESCRIPTION:Save the Date. Official invite and more details to come.", "END:VEVENT", "END:VCALENDAR"].join('\r\n');
  var EV = {title:'Chantelle & Nicholas - Wedding Day',
            loc:'Centennial Vineyards, 252 Centennial Road, Bowral NSW 2576',
            desc:'Save the Date. Official invite and more details to come.',
            z0:'20270513T053000Z', z1:'20270513T130000Z',
            l0:'2027-05-13T15:30:00+10:00', l1:'2027-05-13T23:00:00+10:00'};
  var hosted = /^https?:$/.test(location.protocol);
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var e = encodeURIComponent;
  var fileFlow = function(){
    if (hosted) { window.location.href = 'chantelle-and-nicholas.ics'; return; }
    var url = URL.createObjectURL(new Blob([ICS], {type:'text/calendar;charset=utf-8'}));
    if (isIOS) { window.location.href = url; setTimeout(function(){ URL.revokeObjectURL(url); }, 10000); return; }
    var a = document.createElement('a'); a.href = url; a.download = 'chantelle-and-nicholas.ics';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
  };
  var addTo = function(kind){
    if (kind === 'google') {
      window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + e(EV.title) +
        '&dates=20270513T153000/20270513T230000&ctz=Australia/Sydney&location=' + e(EV.loc) + '&details=' + e(EV.desc), '_blank', 'noopener');
    } else if (kind === 'outlook') {
      window.open('https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent' +
        '&subject=' + e(EV.title) + '&startdt=' + e(EV.l0) + '&enddt=' + e(EV.l1) +
        '&location=' + e(EV.loc) + '&body=' + e(EV.desc), '_blank', 'noopener');
    } else { fileFlow(); }
  };
  var calBtn = document.getElementById('ivCal'), calMenu = document.getElementById('ivCalMenu');
  var setCal = function(open){ calMenu.hidden = !open; calBtn.setAttribute('aria-expanded', String(open));
    if (open) calMenu.querySelector('button').focus({preventScroll:true}); };
  calBtn.addEventListener('click', function(ev){ ev.stopPropagation(); setCal(calMenu.hidden); });
  calMenu.addEventListener('click', function(ev){ var k = ev.target.getAttribute('data-cal'); if (k) { addTo(k); setCal(false); } });
  document.addEventListener('click', function(ev){ if (!ev.target.closest('.iv-cal')) setCal(false); });

  document.getElementById('ivReplay').addEventListener('click', function(){ setCal(false); replay(); });
  open.addEventListener('click', openIt);
  skip.addEventListener('click', jump);
  document.addEventListener('keydown', function(k){
    if (k.key !== 'Escape') return;
    if (!calMenu.hidden) { setCal(false); calBtn.focus(); return; }
    jump();
  });
})();
